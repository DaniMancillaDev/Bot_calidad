name: CI/CD Pipeline (Semantic Release & Docker)

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Validación ──
  validate:
    name: Validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - uses: astral-sh/setup-uv@v4

      - name: Instalar dependencias
        run: uv sync

      - name: Verificar imports
        run: |
          uv run python -c "import bot.app"
          uv run python -c "import shared.infrastructure.orientation.orientation_engine"
          uv run python -c "import database"

  # ── Job 2: Semantic Release ──
  release:
    name: Semantic Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Docker Build & Push ──
  build-docker:
    name: Build & Push Docker
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        run: |
          VERSION=${{ needs.release.outputs.new_release_version }}
          DOCKER_REPO="${{ secrets.DOCKER_USERNAME }}/bot-calidad"

          echo "Construyendo imagen $DOCKER_REPO:$VERSION..."

          docker build -t $DOCKER_REPO:$VERSION .
          docker tag $DOCKER_REPO:$VERSION $DOCKER_REPO:latest

          echo "Subiendo imágenes a Docker Hub..."
          docker push $DOCKER_REPO:$VERSION
          docker push $DOCKER_REPO:latest
