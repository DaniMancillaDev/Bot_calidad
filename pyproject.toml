[project]
name = "botcalidad"
version = "1.0.0"
description = "Bot de Telegram y panel Django para gestion de reportes de calidad con IA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.4",
    "python-telegram-bot>=22.1",
    "pillow>=10.4.0",
    "openpyxl>=3.1.5",
    "onnxruntime>=1.25.1",
    "numpy>=2.4.4",
    "httpx>=0.28.1",
    "hupper>=1.12.1",
    "huggingface-hub>=0.31.4",
    "aiofiles>=23.2.1",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.1.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "djangorestframework>=3.17.1",
    "tenacity>=9.1.4",
    "pyzbar>=0.1.9",
    "openai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
