worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 500M;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        location /protected/fotos/ {
            internal;
            alias /app/media_files/fotos/;
        }

        location /protected/thumbs/ {
            internal;
            alias /app/media_files/thumbs/;
        }

        location /protected/proxies/ {
            internal;
            alias /app/media_files/proxies/;
        }

        location /protected/importaciones_temp/ {
            internal;
            alias /app/media_files/importaciones_temp/;
        }

        location /media/ {
            return 403;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
    }
}
