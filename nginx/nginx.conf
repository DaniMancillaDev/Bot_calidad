events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Límite de tamaño para subida de fotos (el bot no sube, pero por si acaso)
    client_max_body_size 50M;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── Thumbnails optimizados (feed operativo) ──────────────────────────
        location /media/thumbs/ {
            alias /app/media_files/thumbs/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            gzip_static on;
        }

        # ── Fotos originales (solo modal/zoom, bajo demanda) ──────────────────
        location /media/fotos/ {
            alias /app/media_files/fotos/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Proxies (para visualización web optimizada) ────────────────────────
        location /media/proxies/ {
            alias /app/media_files/proxies/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Bloquear acceso a CUALQUIER otra ruta de media (seguridad)
        location /media/ {
            return 403;
        }

        # Estáticos (CSS, JS de Admin, etc)
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Todo lo demás va a Django
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
    }
}
