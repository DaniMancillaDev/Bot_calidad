worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance: Direct Kernel-to-Socket Transfer & File Cache
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Límite de tamaño para subida de fotos
    client_max_body_size 50M;

    upstream django {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Thumbnails optimizados (feed operativo de alta velocidad) ────────
        location /media/thumbs/ {
            alias /app/media_files/thumbs/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # ── Fotos originales (solo modal/zoom, bajo demanda) ──────────────────
        location /media/fotos/ {
            alias /app/media_files/fotos/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # ── Proxies (para visualización modal optimizada) ──────────────────────
        location /media/proxies/ {
            alias /app/media_files/proxies/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # Bloquear acceso a CUALQUIER otra ruta de media (seguridad)
        location /media/ {
            return 403;
        }

        # Estáticos (CSS, JS de Admin, etc)
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Todo lo demás va a Django
        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
    }
}
